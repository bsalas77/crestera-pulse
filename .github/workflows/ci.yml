name: CI

on:
  push:
    branches: [main]
  pull_request:

# The RUNNER repo variable selects a self-hosted runner. That is only safe while
# this repository is PRIVATE (only collaborators can open pull requests).
#
# Before making the repository public, delete the RUNNER variable AND remove the
# runner registered to this repo. Do not rely on the expressions below to protect
# it: a pull request can edit this very file (e.g. `runs-on: self-hosted`), and a
# runner with the Docker socket mounted gives that code root on the Docker host.
jobs:
  api:
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.repository.private) && vars.RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: dashboard_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: ${{ (((github.event_name != 'pull_request' || github.event.repository.private) && vars.RUNNER) && 'host.docker.internal') || 'localhost' }}
      DB_PORT: 55433
      DB_USER: dashboard
      DB_PASS: ci-only-not-a-real-secret
      DB_NAME: dashboard_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ui:
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.repository.private) && vars.RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
