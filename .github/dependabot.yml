# Weekly update PRs for everything Pulse ships: npm packages, Docker base images and CI actions.
# CI runs on each PR; nothing merges by itself.
#
# Some majors need their own planned upgrade rather than a weekly bump, so
# Dependabot leaves them alone (security updates still arrive):
# TypeScript 7 waits until typescript-eslint supports it (8.x stops at 6.0);
# @types/node and the Node images follow the Node LTS line (26 since October 2026).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/api, /ui, /db]
    schedule:
      interval: weekly
    ignore:
      # A new Postgres major can't open an existing install's data directory
      # without a dump and restore, so it must be a deliberate, documented upgrade.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
