# Weekly update PRs for everything Pulse ships: npm packages, Docker base images and CI actions.
# CI runs on each PR; nothing merges by itself.
#
# Some majors need their own planned upgrade rather than a weekly bump, so
# Dependabot leaves them alone (security updates still arrive):
# TypeScript 7 is a new compiler; React 19 must move react and react-dom
# together; Vite 8 needs the next major of the React plugin; @types/node and
# the Node images follow the Node LTS line (24 until Node 26 becomes LTS).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/api, /ui, /db]
    schedule:
      interval: weekly
    ignore:
      # A new Postgres major can't open an existing install's data directory
      # without a dump and restore, so it must be a deliberate, documented upgrade.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
