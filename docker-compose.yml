# Crestera Pulse. All settings come from .env (see README "Quick start").
# A fixed project name keeps your data volume the same whatever this folder is
# called (for example after unpacking a newer download next to the old one).
name: crestera-pulse

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in your .env file (see README - Running it)}
      POSTGRES_DB: ${DB_NAME:-dashboard}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not published to the host: only the API talks to the database.
    # (docker-compose.dev.yml publishes it for local development and tests.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dashboard} -d ${DB_NAME:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dashboard}
      DB_PASS: ${DB_PASS:?Set DB_PASS in your .env file (see README - Running it)}
      DB_NAME: ${DB_NAME:-dashboard}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (see README - Running it)}
      CORS_ORIGIN: http://localhost:${UI_PORT:-3000},http://127.0.0.1:${UI_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      # Your own reverse proxies in front of Pulse (README "Serving it to other people").
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # The UI's nginx, which forwards /api here.
      BUILTIN_PROXY_HOPS: 1
    volumes:
      # Your CSV files for the importer (README "Bring your own data"). Read-only;
      # `z` lets SELinux hosts (RHEL, Alma, Fedora) share the folder with the container.
      - ./import:/import:ro,z
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not published: browsers reach the API through the UI's /api path.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ui:
    build:
      context: ./ui
      args:
        VITE_CRESTERA_URL: ${CRESTERA_URL-https://github.com/bsalas77}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:8080"

volumes:
  db_data:
