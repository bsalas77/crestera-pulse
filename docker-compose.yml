services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${DB_USER:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in your .env file (copy .env.example)}
      POSTGRES_DB: ${DB_NAME:-dashboard}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dashboard} -d ${DB_NAME:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dashboard}
      DB_PASS: ${DB_PASS:?Set DB_PASS in your .env file (copy .env.example)}
      DB_NAME: ${DB_NAME:-dashboard}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (copy .env.example and generate a real secret)}
      CORS_ORIGIN: ${PUBLIC_UI_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ./ui
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_CRESTERA_URL: ${CRESTERA_URL:-}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:8080"

volumes:
  db_data:
